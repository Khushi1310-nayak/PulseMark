version: '3.8'

services:
  # 1. PulseMark API Server (Fastify + Yahoo Finance + SSE)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
    restart: always

  # 2. PulseMark Web Frontend (Next.js 14)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - api
    restart: always

  # 3. Distributed Redis Cache (Tick sliding window & circuit breaker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
